server {
    listen 80;
    root /usr/share/nginx/html;

    # The backend is reached only over HTTP: /api/<path> → custom-backend:8000/<path>.
    # Chat answers come from a CPU model and can take minutes.
    location /api/ {
        proxy_pass http://custom-backend:8000/;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
