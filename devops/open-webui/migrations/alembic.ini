# Alembic config for the tables owned by this repo's Open WebUI event Functions
# (devops/open-webui/functions/), which live in Open WebUI's own `open_webui` database.
# Kept separate from Open WebUI's migrations: history is tracked in `fn_alembic_version`,
# never Open WebUI's `alembic_version`. Run by the `open-webui-fn-migrate` compose service.
[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
