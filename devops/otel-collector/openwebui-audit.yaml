# OpenTelemetry Collector config for the `openwebui-audit-shipper` service: tails Open WebUI's
# audit log (AUDIT_LOG_LEVEL on open-webui, one JSON object per line) from the open-webui-data
# volume and sends it to OpenObserve stream `openwebui_audit`. Open WebUI itself never exports
# audit entries over OTel — they only go to this file. A second pipeline sends query.log (web
# search queries, source sites and chunk count per chat request, written by the Query Log Function,
# devops/open-webui/functions/query_log.py) to stream `openwebui_queries`.
extensions:
  # Remembers how far each file has been read, so restarts don't re-send old entries.
  file_storage:
    directory: /var/lib/otelcol/file_storage

receivers:
  filelog/openwebui_audit:
    # Only the live file: Open WebUI rotates it to audit.<date>.log.zip at 10 MB
    # (AUDIT_LOG_FILE_ROTATION_SIZE), and the collector picks up the new audit.log by fingerprint.
    include: [/open-webui-data/audit.log]
    start_at: beginning
    storage: file_storage
    operators:
      # Fields land as attributes (O2 flattens nested ones, e.g. user_email, user_role).
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout_type: epoch
          layout: s
      # Readable one-line body for O2's log view: time (UTC), user, method, URL, status, e.g.
      # "2026-10-02 13:11:55 alice@example.com POST https://<host>:8444/api/v1/... 200".
      # Requests without a signed-in user (e.g. sign-in itself) show "-". The status comes from the
      # Audit Status Code Function (devops/open-webui/functions/audit_status_code.py) — Open WebUI
      # leaves it null at AUDIT_LOG_LEVEL=METADATA — and is "-" when missing (unhandled error, or the
      # Function not active). (quoted: the ": " inside would otherwise make YAML read this as a map)
      - type: add
        field: body
        value: 'EXPR(timestamp.UTC().Format("2006-01-02 15:04:05") + " " + (attributes.user?.email ?? "-") + " " + attributes.verb + " " + attributes.request_uri + " " + (attributes.response_status_code == nil ? "-" : string(attributes.response_status_code)))'

  filelog/openwebui_queries:
    # The Function rotates query.log to query.log.1 at 10 MB; the new file is picked up by fingerprint.
    include: [/open-webui-data/query.log]
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout_type: epoch
          layout: s
      # e.g. "2026-10-03 07:50:25 alice@example.com fast-ai:latest search: Gandhi Jayanti 2026 |
      # Gandhi Jayanti date 2026 -> 5 site(s), 6 chunk(s)"; "search: -" when it didn't search.
      - type: add
        field: body
        value: 'EXPR(timestamp.UTC().Format("2006-01-02 15:04:05") + " " + (attributes.user_email == "" ? "-" : attributes.user_email) + " " + attributes.model + " search: " + (attributes.search_queries == "" ? "-" : attributes.search_queries) + " -> " + string(attributes.sites_count) + " site(s), " + string(attributes.chunks) + " chunk(s)")'

processors:
  resource:
    attributes:
      - key: service.name
        value: open-webui
        action: upsert
  batch: {}

exporters:
  otlphttp/openobserve:
    logs_endpoint: http://openobserve:5080/api/default/v1/logs
    headers:
      Authorization: Basic ${env:OPENOBSERVE_BASIC_AUTH}
      stream-name: openwebui_audit
  otlphttp/openobserve_queries:
    logs_endpoint: http://openobserve:5080/api/default/v1/logs
    headers:
      Authorization: Basic ${env:OPENOBSERVE_BASIC_AUTH}
      stream-name: openwebui_queries

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog/openwebui_audit]
      processors: [resource, batch]
      exporters: [otlphttp/openobserve]
    logs/queries:
      receivers: [filelog/openwebui_queries]
      processors: [resource, batch]
      exporters: [otlphttp/openobserve_queries]
