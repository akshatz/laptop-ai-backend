# Applied automatically by authentik-worker (mounted into /blueprints/custom), and re-applied
# whenever this file changes. Values in !Env come from the worker's environment (devops/.env).
#
# Puts opencode (https://${OPEN_WEBUI_HOST}:4443) behind authentik: Caddy's forward_auth asks the
# embedded outpost on every request, so people sign in with their authentik account (password +
# TOTP, same login flow as Open WebUI). Only users devops/opencode/provision.py has given an opencode
# pass: it puts X-Opencode-Upstream/X-Opencode-Auth in their attributes (additionalHeaders), which the
# outpost hands to Caddy, so each person reaches only their own container. New sign-ups get theirs
# within a minute; until then (or when all OPENCODE_MAX_USERS places are taken) authentik says
# "Permission denied".
version: 1
metadata:
  name: laptop-ai-backend - opencode SSO
entries:
  # Reuses the login flow with required TOTP and the default provider flows.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: laptop-ai-backend - Open WebUI SSO with required TOTP
      required: true

  # Earlier versions allowed only this group (one shared opencode). Removed: everyone gets their own.
  - model: authentik_core.group
    id: opencode-users
    state: absent
    identifiers:
      name: opencode-users

  - model: authentik_providers_proxy.proxyprovider
    id: opencode-provider
    identifiers:
      name: opencode
    attrs:
      mode: forward_single
      # Must match the URL the browser uses: the outpost picks the provider by Host header.
      external_host: !Format ["https://%s:4443", !Env OPEN_WEBUI_HOST]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # How long a sign-in lasts before authentik is asked again.
      access_token_validity: hours=8

  - model: authentik_core.application
    id: opencode-app
    identifiers:
      slug: opencode
    attrs:
      name: opencode
      provider: !KeyOf opencode-provider
      meta_launch_url: !Format ["https://%s:4443/", !Env OPEN_WEBUI_HOST]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      target: !KeyOf opencode-app
      group: !KeyOf opencode-users

  # Passes only users with an assigned opencode (provision.py). Safe whichever is applied first:
  # nobody has the headers until provision.py runs, and it refuses to run before Caddy routes by them.
  - model: authentik_policies_expression.expressionpolicy
    id: opencode-assigned
    identifiers:
      name: opencode-assigned
    attrs:
      expression: |
        headers = (request.user.attributes or {}).get("additionalHeaders") or {}
        return bool(headers.get("X-Opencode-Upstream"))

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf opencode-app
      policy: !KeyOf opencode-assigned
    attrs:
      order: 0

  # The embedded outpost (inside authentik-server) answers Caddy's forward_auth checks. This sets
  # its whole provider list: add any future proxy provider here too.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf opencode-provider
