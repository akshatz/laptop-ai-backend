# Applied automatically by authentik-worker (mounted into /blueprints/custom), and re-applied
# whenever this file changes. Values in !Env come from the worker's environment (devops/.env).
#
# Registers laptop-frontend (the React chat UI for laptop-backend) as an OIDC application, so its
# users sign in with the same authentik account (password + TOTP) as Open WebUI. laptop-backend is
# the confidential client: it sends the browser to authentik and receives the callback through
# laptop-frontend's nginx (/api/auth/callback). Keep the redirect URIs in sync with
# FRONTEND_ORIGINS on laptop-backend.
version: 1
metadata:
  name: laptop-ai-backend - custom-frontend SSO
entries:
  # Reuses the login flow, MFA settings and default flows set up there.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: laptop-ai-backend - Open WebUI SSO with required TOTP
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: custom-frontend-provider
    identifiers:
      name: Custom Frontend
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: !Env CUSTOM_FRONTEND_OIDC_CLIENT_ID
      client_secret: !Env CUSTOM_FRONTEND_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8012/api/auth/callback
        - matching_mode: strict
          url: !Format ["http://%s:8012/api/auth/callback", !Env OPEN_WEBUI_HOST]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: custom-frontend
    attrs:
      name: Custom Frontend
      provider: !KeyOf custom-frontend-provider
      meta_launch_url: !Format ["http://%s:8012/", !Env OPEN_WEBUI_HOST]
      policy_engine_mode: any
