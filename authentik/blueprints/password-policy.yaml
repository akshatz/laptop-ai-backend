# Applied automatically by authentik-worker (mounted into /blueprints/custom), and re-applied
# whenever this file changes.
#
# Password creation rules for authentik accounts (the passwords used to sign in to Open WebUI):
# at least 8 characters with an uppercase letter, a lowercase letter, a digit and a symbol; not
# found in known data breaches (Have I Been Pwned, k-anonymity: only the first 5 characters of the
# password's SHA-1 hash leave the server). The zxcvbn strength check is off on purpose: it
# rejected random 8-character passwords that meet the rules (e.g. "Kx7#mPq2" = "too weak").
# Open WebUI's own password check (ENABLE_PASSWORD_VALIDATION in devops/docker-compose.yml)
# enforces the same length and character rules — keep the two in sync.
#
# These rules tighten authentik's default password-change policy, which the default
# "Password change flow" blueprint owns. That blueprint is re-applied first (below), so this one
# wins — but authentik re-applies its own blueprints when they change, i.e. after an authentik
# upgrade, which resets the policy to authentik's default (8 characters, no character rules).
# Re-apply this blueprint after every authentik version bump (see README "Password rules").
#
# Checked when users change their own password (user settings → Change password). Passwords an
# admin types in the admin UI (Directory → Users → Set password) are NOT checked — follow the rules
# by hand there.
version: 1
metadata:
  name: laptop-ai-backend - Password creation rules
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Password change flow
      required: true

  - model: authentik_policies_password.passwordpolicy
    identifiers:
      name: default-password-change-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 8
      amount_uppercase: 1
      amount_lowercase: 1
      amount_digits: 1
      amount_symbols: 1
      check_have_i_been_pwned: true
      hibp_allowed_count: 0
      check_zxcvbn: false
      error_message: >-
        Password must be at least 8 characters and include an uppercase letter,
        a lowercase letter, a number and a symbol.
