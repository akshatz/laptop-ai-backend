# Applied automatically by authentik-worker (mounted into /blueprints/custom), and re-applied
# whenever this file changes.
#
# Self-service password reset, linked as "Forgot username or password?" from authentik's login page
# (the one Open WebUI's "Continue with authentik" opens), and used for the recovery links admins can
# send from Directory → Users. The user:
#   1. enters their email or username. Unknown ones get "Failed to authenticate" — the code stage
#      below needs a real user, and the sign-up form already reveals which emails are registered,
#      so pretending the account exists would hide nothing,
#   2. types the 6-digit code emailed to their account's address (authentik's global
#      AUTHENTIK_EMAIL__* settings, valid 15 minutes, attempts throttled), in the same tab.
#      authentik's link-only email stage can't send codes, so this uses its Email authenticator
#      stage, which is meant for enrolling email as an MFA method: it refuses users who already have
#      an email device for it and saves one on success. The `password-recovery-clear-email-code`
#      policy deletes that device before the code step and again after it, so email never becomes a
#      sign-in method (login MFA is TOTP/static only anyway) and the next reset works,
#   3. enters a code from their TOTP app or a static recovery code. A stolen mailbox alone isn't
#      enough to take over an account. Users with no authenticator are refused (an admin resets
#      them, see README "Lost authenticator") — the login flow's MFA stage would instead let them
#      enroll a new authenticator, so it's not reused here,
#   4. sets a new password (password creation rules from password-policy.yaml), and is logged in.
version: 1
metadata:
  name: laptop-ai-backend - Password recovery
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: laptop-ai-backend - Password creation rules
      required: true

  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: password-recovery
    attrs:
      name: Password recovery
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated

  - model: authentik_stages_identification.identificationstage
    id: identification-stage
    identifiers:
      name: password-recovery-identification
    attrs:
      user_fields:
        - email
        - username
      # The code stage needs a real pending user (it fails on a made-up one), so unknown emails are
      # refused here. Sign-up already reveals whether an email is registered.
      pretend_user_exists: false

  # The former link-based email stage; removed in favour of the code stage below.
  - model: authentik_stages_email.emailstage
    state: absent
    identifiers:
      name: password-recovery-email

  - model: authentik_stages_authenticator_email.authenticatoremailstage
    id: email-code-stage
    identifiers:
      name: password-recovery-email-code
    attrs:
      friendly_name: Email code
      use_global_settings: true
      subject: Your password reset code
      # authentik/email-templates/ (mounted at /templates): says it's a reset code instead of the
      # default "Email MFA code", puts the code in the preview text so Gmail/iOS Mail offer
      # "Copy code", and makes it select with one tap. Emails can't run scripts, so no real copy button.
      template: password_reset_code.html
      token_expiry: minutes=15

  - model: authentik_policies_expression.expressionpolicy
    id: clear-email-code
    identifiers:
      name: password-recovery-clear-email-code
    attrs:
      expression: |
        from authentik.stages.authenticator_email.models import EmailDevice
        user = request.context["flow_plan"].context.get("pending_user")
        if user is not None and user.pk:
            EmailDevice.objects.filter(user=user, stage__name="password-recovery-email-code").delete()
        return True

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-stage
    identifiers:
      name: password-recovery-mfa
    attrs:
      device_classes:
        - totp
        - static
      not_configured_action: deny
      last_auth_threshold: seconds=0

  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: password-recovery-field-password
    attrs:
      field_key: password
      label: New password
      type: password
      required: true
      placeholder: New password
      sub_text: At least 8 characters, with an uppercase letter, a lowercase letter, a number and a symbol.
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: password-recovery-field-password-repeat
    attrs:
      field_key: password_repeat
      label: New password (repeat)
      type: password
      required: true
      placeholder: New password (repeat)
      order: 1
  - model: authentik_stages_prompt.promptstage
    id: prompt-stage
    identifiers:
      name: password-recovery-prompt
    attrs:
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]

  - model: authentik_stages_user_write.userwritestage
    id: write-stage
    identifiers:
      name: password-recovery-write
    attrs:
      user_creation_mode: never_create

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf identification-stage
      order: 10
  # Bindings evaluated when reached (not at plan time), so the device cleanup runs right before
  # the code step and right after it.
  - model: authentik_flows.flowstagebinding
    id: email-code-binding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf email-code-stage
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf mfa-stage
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf email-code-binding
      policy: !KeyOf clear-email-code
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mfa-binding
      policy: !KeyOf clear-email-code
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage
      order: 40
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf write-stage
      order: 50
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 60

  # "Forgot username or password?" on the login page. authentik's default blueprint only sets
  # user_fields on this stage, repeated here because validation rejects the stage without it
  # (self-enrollment.yaml sets enrollment_flow on the same stage the same way).
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      recovery_flow: !KeyOf flow

  # Recovery links admins create under Directory → Users use the brand's recovery flow. authentik's
  # default brand blueprint doesn't set this field.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !KeyOf flow
