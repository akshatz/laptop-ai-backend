# Applied automatically by authentik-worker (mounted into /blueprints/custom), and re-applied
# whenever this file changes. Values in !Env come from the worker's environment (devops/.env).
#
# 1. MFA in authentik's default login flow, switched by AUTHENTIK_MFA_REQUIRED: true (default) →
#    everyone, and users without a TOTP device are sent through TOTP setup (QR code for Google
#    Authenticator or any TOTP app) before their first login completes; false → authentik admins
#    only. Only TOTP and static recovery codes are accepted.
# 2. Registers Open WebUI as an OIDC application (confidential client, redirect URIs for the
#    Caddy HTTPS front and plain localhost).
version: 1
metadata:
  name: laptop-ai-backend - Open WebUI SSO with required TOTP
entries:
  # The default flows below are created by authentik's own blueprints; wait for them first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true

  # authentik's default blueprint creates this stage without attrs, so the settings here
  # aren't reset when that blueprint re-applies.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-validation-stage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes:
        - totp
        - static
      # AUTHENTIK_MFA_REQUIRED (.env, true/false or 1/0, default true): true → users without an authenticator
      # must set one up; false → they skip it here, and on login the step runs only for authentik admins
      # (policy default-authentication-mfa-switch below). Any other value counts as true. Also governs
      # sign-up/invitation, which reuse this stage.
      # authentik only re-applies a blueprint when the FILE changes, so after changing the variable:
      # recreate authentik-worker, then `ak apply_blueprint /blueprints/custom/open-webui-sso.yaml`.
      not_configured_action: !AtIndex [{"true": configure, "1": configure, "false": skip, "0": skip}, !Env [AUTHENTIK_MFA_REQUIRED, "true"], configure]
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
      # After a code is entered, skip the code (not the password) for 3 hours in that browser:
      # authentik sets a signed `authentik_mfa` cookie bound to this stage and the device used.
      # Other browsers/devices still ask. The password-recovery flow has its own MFA stage and
      # always asks.
      last_auth_threshold: hours=3

  # With AUTHENTIK_MFA_REQUIRED=false, the login's MFA step runs only for authentik admins
  # (superusers, e.g. akadmin); everyone else signs in with the password alone, even with an
  # authenticator (it stays registered for when the switch goes back to true). The value is written
  # into the expression when this blueprint is applied. Login only: sign-up/invitation need nothing
  # more (new users have no authenticator, so the stage's skip applies), and password recovery has
  # its own MFA stage, which still asks users who have one.
  - model: authentik_policies_expression.expressionpolicy
    id: mfa-switch-policy
    identifiers:
      name: default-authentication-mfa-switch
    attrs:
      expression: !Format
        - |
          mfa_required = %s  # AUTHENTIK_MFA_REQUIRED, filled in by the blueprint
          user = request.context.get("pending_user") or request.user
          return mfa_required or user.is_superuser
        - !AtIndex [{"true": "True", "1": "True", "false": "False", "0": "False"}, !Env [AUTHENTIK_MFA_REQUIRED, "true"], "True"]

  # The login flow's MFA step (created by authentik's default blueprint, which sets no attrs on it).
  # Its policies must run when the step is reached, against the user signing in, and all must pass;
  # the hand-made mfa-exempt group binding on it relies on this too.
  - model: authentik_flows.flowstagebinding
    id: login-mfa-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf mfa-validation-stage
    attrs:
      order: 30
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf login-mfa-binding
      policy: !KeyOf mfa-switch-policy
    attrs:
      order: 20

  # Eye icon to show/hide the password on the login page. authentik's default blueprint sets only
  # backends and configure_flow on this stage (repeated here with the same values, since
  # validation rejects the stage without them), so allow_show_password isn't reset when it
  # re-applies. Prompt forms (sign-up, invitations, reset, settings) have no such option in
  # authentik — their password boxes stay plain.
  - model: authentik_stages_password.passwordstage
    identifiers:
      name: default-authentication-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.sources.kerberos.auth.KerberosBackend
        - authentik.sources.ldap.auth.LDAPBackend
        - authentik.core.auth.TokenBackend
      configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]
      allow_show_password: true

  - model: authentik_providers_oauth2.oauth2provider
    id: open-webui-provider
    identifiers:
      name: Open WebUI
    attrs:
      client_type: confidential
      # Must be listed explicitly: a blueprint-created provider otherwise allows no grant types and
      # authentik rejects the login ("Invalid grant_type for provider").
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env OPEN_WEBUI_OIDC_CLIENT_ID
      client_secret: !Env OPEN_WEBUI_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256-signed ID tokens, verifiable through the provider's JWKS.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # Open WebUI sends /oauth/oidc/callback (its `oauth_login_callback` route resolves to that path);
      # /oauth/oidc/login/callback is the same handler, kept in case a future version switches.
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s:8444/oauth/oidc/callback", !Env OPEN_WEBUI_HOST]
        - matching_mode: strict
          url: https://localhost:8444/oauth/oidc/callback
        - matching_mode: strict
          url: http://localhost:8082/oauth/oidc/callback
        # Plain HTTP on the LAN IP (direct to the open-webui port). Works because the code exchange
        # still needs the client secret + PKCE, but prefer https://<host>:8444.
        - matching_mode: strict
          url: !Format ["http://%s:8082/oauth/oidc/callback", !Env OPEN_WEBUI_HOST]
        - matching_mode: strict
          url: !Format ["https://%s:8444/oauth/oidc/login/callback", !Env OPEN_WEBUI_HOST]
        - matching_mode: strict
          url: https://localhost:8444/oauth/oidc/login/callback
        - matching_mode: strict
          url: http://localhost:8082/oauth/oidc/login/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: open-webui
    attrs:
      name: Open WebUI
      provider: !KeyOf open-webui-provider
      meta_launch_url: !Format ["https://%s:8444/", !Env OPEN_WEBUI_HOST]
      policy_engine_mode: any
