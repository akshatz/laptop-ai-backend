server {
    listen 80;
    root /usr/share/nginx/html;

    # The backend is reached only over HTTP: /api/<path> → laptop-backend:8000/<path>.
    # Chat answers come from a CPU model and can take minutes.
    location /api/ {
        proxy_pass http://laptop-backend:8000/;
        proxy_read_timeout 600s;
        # Document uploads: up to 5 files of 10 MB each (laptop-backend checks the limits).
        client_max_body_size 60m;
        # Host with the port: laptop-backend builds the authentik callback URL from it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
