name: Tests

# Runs pytest (tests/) on every push and pull request: custom-backend against a throwaway
# Postgres, and the Open WebUI Functions' logic with Open WebUI's internals stubbed.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as postgres-db in devops/docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: custom_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d custom_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/custom_backend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same as custom-backend's image (python:3.11-alpine).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            custom-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r tests/requirements.txt
      - name: Run tests
        run: |
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ) at commit ${GITHUB_SHA::7}"
          pytest -v
          echo "Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
