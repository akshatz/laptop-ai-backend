name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build custom-backend image
        run: docker build -f custom-backend/Dockerfile .
