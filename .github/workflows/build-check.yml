name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the build check against"
        required: true
        default: main

# The jobs only check out, validate and build; nothing needs write access to the repo.
permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      # .env is gitignored, so validate with the documented example values. Required variables
      # (${VAR:?...}, e.g. OLLAMA_CONTAINER_ID, whose blank value would mount every container's
      # logs) fail without them, and a variable missing from .env.example shows up here.
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example -f devops/docker-compose.yml config -q

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Build laptop-backend image
        run: docker build -f laptop-backend/Dockerfile .

  # Type-checks and builds the React app inside its image (npm ci + tsc + vite build).
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Build laptop-frontend image
        run: docker build laptop-frontend

  # Caddyfile and OpenTelemetry Collector configs, validated in the images compose runs them in.
  config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Validate configs
        run: devops/validate-configs.sh
