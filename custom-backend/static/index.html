<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laptop Dev Backend — Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin-bottom: 1rem; }
  label { display: block; margin-top: 0.5rem; font-size: 0.9rem; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 0.4rem; margin-top: 0.2rem; }
  textarea { min-height: 4rem; }
  button { margin-top: 0.6rem; padding: 0.4rem 1rem; cursor: pointer; }
  #messages { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; min-height: 8rem; margin-bottom: 0.5rem; }
  .msg { margin-bottom: 0.5rem; }
  .msg .role { font-weight: 600; }
  #status { color: #a00; font-size: 0.85rem; min-height: 1.2rem; }
</style>
</head>
<body>
<h1>Laptop Dev Backend — Chat</h1>
<p id="status"></p>

<details>
  <summary>New here? Sign up</summary>
  <fieldset>
    <legend>Sign up</legend>
    <label>Name
      <input id="signupName" autocomplete="name">
    </label>
    <label>Email
      <input id="signupEmail" type="email" autocomplete="email">
    </label>
    <label>Password
      <input id="signupPassword" type="password" autocomplete="new-password">
    </label>
    <label>Repeat password
      <input id="signupPassword2" type="password" autocomplete="new-password">
    </label>
    <button onclick="signUp()">Create account</button>
    <label>Verification token (sent by email after sign-up)
      <input id="verifyToken" autocomplete="off">
    </label>
    <button onclick="verifyEmail()">Verify email</button>
  </fieldset>
</details>

<fieldset>
  <legend>0. Sign in</legend>
  <label>Email
    <input id="loginEmail" type="email" autocomplete="username">
  </label>
  <label>Password
    <input id="loginPassword" type="password" autocomplete="current-password">
  </label>
  <label id="otpLabel" hidden>One-time code (sent by email)
    <input id="loginOtp" inputmode="numeric" autocomplete="one-time-code">
  </label>
  <button onclick="signIn()">Sign in</button>
  <button onclick="signOut()">Sign out</button>
  <div>Signed in as: <span id="signedInAs">(nobody)</span></div>
  <div id="mfaRow" hidden>
    Email code at sign-in (MFA): <strong id="mfaState"></strong>
    <button id="mfaToggle" onclick="toggleMfa()"></button>
  </div>
</fieldset>

<fieldset>
  <legend>1. Create a chat</legend>
  <label>User ID (UUID, filled in by signing in)
    <input id="userId" placeholder="sign in above, or paste an id from /users">
  </label>
  <label>Model
    <select id="modelId"><option value="llama3.2">llama3.2</option></select>
  </label>
  <button onclick="createChat()">Create chat</button>
  <div>Chat ID: <code id="chatId">(none yet)</code></div>
</fieldset>

<fieldset>
  <legend>2. Ingest documents (optional, for RAG context — up to 5 at once)</legend>
  <label>Text 1<textarea class="docText" placeholder="paste some text to give the assistant context for this chat"></textarea></label>
  <label>Text 2 (optional)<textarea class="docText"></textarea></label>
  <label>Text 3 (optional)<textarea class="docText"></textarea></label>
  <label>Text 4 (optional)<textarea class="docText"></textarea></label>
  <label>Text 5 (optional)<textarea class="docText"></textarea></label>
  <button onclick="ingestDocs()">Ingest</button>
</fieldset>

<fieldset>
  <legend>3. Chat</legend>
  <div id="messages"></div>
  <label>Message
    <input id="messageInput" placeholder="say something">
  </label>
  <button onclick="sendMessage()">Send</button>
</fieldset>

<script>
let chatId = null;
let otpPending = false;
let currentUser = null;

function setStatus(text) {
  document.getElementById('status').textContent = text || '';
}

// Fill the model dropdown from Ollama; on failure the llama3.2 option stays.
async function loadModels() {
  try {
    const res = await fetch('/models');
    if (!res.ok) throw new Error(await res.text());
    const { default: def, models } = await res.json();
    if (!models.length) return;
    const wanted = def.includes(':') ? def : def + ':latest';
    const select = document.getElementById('modelId');
    select.replaceChildren(...models.map(name => new Option(name, name, false, name === wanted)));
  } catch (err) {
    setStatus('Could not load the model list: ' + err.message);
  }
}
loadModels();

// Remembered for this tab only; there's no session token, the id just pre-fills the form.
function setSignedIn(user) {
  document.getElementById('userId').value = user ? user.id : '';
  document.getElementById('signedInAs').textContent = user ? `${user.name} <${user.email}>` : '(nobody)';
  document.getElementById('mfaRow').hidden = !user;
  if (user) {
    document.getElementById('loginEmail').value = user.email;
    document.getElementById('mfaState').textContent = user.mfa_enabled ? 'on' : 'off';
    document.getElementById('mfaToggle').textContent = user.mfa_enabled ? 'Turn off' : 'Turn on';
  }
  currentUser = user;
  try {
    if (user) sessionStorage.setItem('signedInUser', JSON.stringify(user));
    else sessionStorage.removeItem('signedInUser');
  } catch (_) {}
}

async function postJson(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const text = await res.text();
    let detail = text;
    try { detail = JSON.parse(text).detail || text; } catch (_) {}
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return res.json();
}

async function signIn() {
  setStatus('');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  try {
    if (otpPending) {
      const otp_code = document.getElementById('loginOtp').value.trim();
      const user = await postJson('/mfa/verify-otp', { email, otp_code });
      otpPending = false;
      document.getElementById('otpLabel').hidden = true;
      setSignedIn(user);
      return;
    }
    const result = await postJson('/login', { email, password });
    if (result.password_reset_required) {
      setStatus('Your password has expired; a reset code was emailed. Reset it via /password/reset, then sign in again.');
    } else if (result.mfa_required) {
      otpPending = true;
      document.getElementById('otpLabel').hidden = false;
      setStatus('A one-time code was emailed to you. Enter it and press Sign in again.');
    } else {
      setSignedIn(result.user);
    }
  } catch (err) {
    setStatus('Sign-in failed: ' + err.message);
  }
}

async function signUp() {
  setStatus('');
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  if (!name || !email || !password) { setStatus('Fill in name, email and password.'); return; }
  if (password !== document.getElementById('signupPassword2').value) {
    setStatus('The two passwords differ.'); return;
  }
  try {
    await postJson('/users', { name, email, password });
    document.getElementById('loginEmail').value = email;
    setStatus('Account created. Check your email for the verification token, paste it below and press Verify email.');
  } catch (err) {
    setStatus('Sign-up failed: ' + err.message);
  }
}

async function verifyEmail() {
  setStatus('');
  const token = document.getElementById('verifyToken').value.trim();
  if (!token) { setStatus('Paste the token from the email first.'); return; }
  try {
    const user = await postJson('/users/verify', { token });
    document.getElementById('loginEmail').value = user.email;
    document.getElementById('verifyToken').value = '';
    document.getElementById('signupPassword').value = '';
    document.getElementById('signupPassword2').value = '';
    setStatus('Email verified. You can sign in now.');
  } catch (err) {
    setStatus('Verification failed: ' + err.message);
  }
}

// /mfa/enable and /mfa/disable check the password again, so it must still be in the field.
async function toggleMfa() {
  setStatus('');
  if (!currentUser) return;
  const password = document.getElementById('loginPassword').value;
  if (!password) { setStatus('Enter your password above to change MFA.'); return; }
  const url = currentUser.mfa_enabled ? '/mfa/disable' : '/mfa/enable';
  try {
    const user = await postJson(url, { email: currentUser.email, password });
    setSignedIn(user);
    setStatus(user.mfa_enabled
      ? 'MFA is on: from now on, signing in also asks for a code sent by email.'
      : 'MFA is off: signing in needs only your password.');
  } catch (err) {
    setStatus('Changing MFA failed: ' + err.message);
  }
}

function signOut() {
  otpPending = false;
  document.getElementById('otpLabel').hidden = true;
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginOtp').value = '';
  setSignedIn(null);
}

try {
  const saved = JSON.parse(sessionStorage.getItem('signedInUser') || 'null');
  if (saved) setSignedIn(saved);
} catch (_) {}

async function createChat() {
  setStatus('');
  const userId = document.getElementById('userId').value.trim();
  const modelId = document.getElementById('modelId').value.trim() || 'llama3.2';
  if (!userId) { setStatus('Sign in (or enter a user ID) first.'); return; }

  try {
    const res = await fetch('/chats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, model_id: modelId }),
    });
    if (!res.ok) throw new Error(await res.text());
    const chat = await res.json();
    chatId = chat.id;
    document.getElementById('chatId').textContent = chatId;
    document.getElementById('messages').innerHTML = '';
  } catch (err) {
    setStatus('Failed to create chat: ' + err.message);
  }
}

async function ingestDocs() {
  setStatus('');
  if (!chatId) { setStatus('Create a chat first.'); return; }
  const texts = Array.from(document.querySelectorAll('.docText'))
    .map(el => el.value.trim())
    .filter(Boolean);
  if (!texts.length) return;

  try {
    const res = await fetch(`/chats/${chatId}/documents`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documents: texts.map(text => ({ text })) }),
    });
    if (!res.ok) throw new Error(await res.text());
    const result = await res.json();
    setStatus(`Ingested ${result.documents_ingested} document(s), ${result.chunks_ingested} chunk(s).`);
  } catch (err) {
    setStatus('Failed to ingest documents: ' + err.message);
  }
}

function appendMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg';
  const roleSpan = document.createElement('span');
  roleSpan.className = 'role';
  roleSpan.textContent = `${role}: `;
  div.append(roleSpan, document.createTextNode(content));
  document.getElementById('messages').appendChild(div);
}

async function sendMessage() {
  setStatus('');
  if (!chatId) { setStatus('Create a chat first.'); return; }
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content) return;

  appendMessage('user', content);
  input.value = '';

  try {
    const res = await fetch(`/chats/${chatId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (!res.ok) throw new Error(await res.text());
    const reply = await res.json();
    appendMessage('assistant', reply.content);
  } catch (err) {
    setStatus('Failed to send message: ' + err.message);
  }
}
</script>
</body>
</html>
